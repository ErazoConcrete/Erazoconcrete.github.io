# Jekyll Configuration for Erazo Concrete LLC

title: Erazo Concrete LLC
description: Professional concrete services and solutions
author: Erazo Concrete LLC
email: info@erazoconcrete.com
phone: (555) 123-4567
url: https://erazo-concrete.com
baseurl: 

# Build settings
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Collections
collections:
  services:
    output: true
    permalink: /services/:name/
  projects:
    output: true
    permalink: /projects/:name/

# Permalink settings
permalink: /:title/

# Exclude from build
exclude:
  - .gitignore
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
