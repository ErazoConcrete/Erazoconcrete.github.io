<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <!-- Dark Mode Theme Script -->
  <script>
    (function() {
      const savedTheme = localStorage.getItem('theme') || 'system';
      function getSystemTheme() {
        return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      function applyTheme(theme) {
        const themeToApply = theme === 'system' ? getSystemTheme() : theme;
        document.documentElement.setAttribute('data-theme', themeToApply);
        localStorage.setItem('theme', theme);
      }
      applyTheme(savedTheme);
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
        if (localStorage.getItem('theme') === 'system') {
          applyTheme('system');
        }
      });
    })();
  </script>
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-PGPR3RC79K"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-PGPR3RC79K');
  </script>
  <!-- Image Rotation Script -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const galleries = document.querySelectorAll('.image-gallery');
      galleries.forEach(gallery => {
        let currentIndex = 0;
        const images = gallery.querySelectorAll('img');
        if (images.length > 1) {
          // Hide extra images immediately on load
          images.forEach((img, idx) => {
            img.style.display = idx === 0 ? 'block' : 'none';
          });
          setInterval(() => {
            currentIndex = (currentIndex + 1) % images.length;
            images.forEach((img, idx) => {
              img.style.display = idx === currentIndex ? 'block' : 'none';
            });
          }, 4000);
        }
      });

      // Theme Toggle
      const themeToggle = document.getElementById('theme-toggle');
      const themeOptions = document.querySelectorAll('.theme-option');
      
      if (themeToggle) {
        const themeMenu = document.getElementById('theme-menu');
        
        themeToggle.addEventListener('click', function(e) {
          e.stopPropagation();
          themeMenu.classList.toggle('active');
        });

        document.addEventListener('click', function(e) {
          if (!themeToggle.contains(e.target)) {
            themeMenu.classList.remove('active');
          }
        });

        themeOptions.forEach(option => {
          option.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            const theme = this.getAttribute('data-theme');
            const themeToApply = theme === 'system' ? window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light' : theme;
            document.documentElement.setAttribute('data-theme', themeToApply);
            localStorage.setItem('theme', theme);
            themeMenu.classList.remove('active');
            updateActiveTheme();
          });
        });

        function updateActiveTheme() {
          const currentTheme = localStorage.getItem('theme') || 'system';
          themeOptions.forEach(option => {
            option.classList.toggle('active', option.getAttribute('data-theme') === currentTheme);
          });
        }
        updateActiveTheme();
      }
    });
  </script>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <div class="header-content site-brand">
        <a href="{{ '/' | relative_url }}" class="site-logo-link">
          <img src="/assets/LOGOTIPO-Sien-FONDO.jpeg" alt="{{ site.title }} logo" class="site-logo">
        </a>
        <div>
          <h1 class="site-title"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
          <p class="site-tagline">{{ site.description }}</p>
        </div>
      </div>
      <nav class="site-nav">
        <ul class="nav-list">
          <li><a href="{{ '/' | relative_url }}" class="nav-link">Home</a></li>
          <li><a href="{{ '/about/' | relative_url }}" class="nav-link">About</a></li>
          <li><a href="{{ '/contact/' | relative_url }}" class="nav-link nav-link--cta">Get Quote</a></li>
          <li class="theme-toggle-container">
            <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">
              <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
              </svg>
            </button>
            <div class="theme-menu" id="theme-menu">
              <button class="theme-option" data-theme="system">System</button>
              <button class="theme-option" data-theme="light">Light</button>
              <button class="theme-option" data-theme="dark">Dark</button>
            </div>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="site-main">
    <div class="container">
      {{ content }}
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-content">
        <div class="footer-section">
          <h3>{{ site.title }}</h3>
          <p>{{ site.description }}</p>
        </div>
        <div class="footer-section">
          <h4>Contact</h4>
          <p>
            <strong>Phone:</strong> <a href="tel:3392317006">339 231 7006</a><br>
            <strong>Email:</strong> <a href="mailto:estimating@erazoconcrete.com">estimating@erazoconcrete.com</a>
          </p>
        </div>
        <div class="footer-section">
          <h4>Quick Links</h4>
          <ul class="footer-links">
            <li><a href="{{ '/contact/' | relative_url }}">Contact</a></li>
          </ul>
        </div>
      </div>
      <div class="footer-bottom">
        <p>&copy; 2026 {{ site.title }}. All rights reserved.</p>
      </div>
    </div>
  </footer>
</body>
</html>
